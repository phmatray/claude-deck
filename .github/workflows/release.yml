name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  # Never cancel a release mid-upload: a half-published tag has no second chance.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Installs, builds and packs: dist/com.phmatray.claudedeck.streamDeckPlugin.
      # Needs `zip` on PATH for the bundled profile (ubuntu-latest has it).
      - name: Pack the Stream Deck plugin
        run: scripts/package.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.streamDeckPlugin --generate-notes
